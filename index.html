<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>360 Panorama Viewer</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
  }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #000;
    color: #f2f2f2;
  }

  .topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 14px 16px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.65), rgba(0,0,0,0));
    pointer-events: none;
  }

  .topbar > * { pointer-events: auto; }

  h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
    color: #eaeaea;
    white-space: nowrap;
  }

  .tabs {
    display: flex;
    gap: 6px;
    background: rgba(26, 26, 32, 0.85);
    backdrop-filter: blur(6px);
    padding: 6px;
    border-radius: 12px;
  }

  .tab-btn {
    appearance: none;
    border: none;
    background: transparent;
    color: #9a9aa5;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .tab-btn:hover { color: #fff; }

  .tab-btn.active {
    background: #4b6bfb;
    color: #fff;
  }

  .tab-content {
    display: none;
    position: fixed;
    inset: 0;
  }

  .tab-content.active {
    display: block;
  }

  .viewer {
    position: absolute;
    inset: 0;
    background: #000;
    display: flex;
    flex-direction: column;
  }

  .stage {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    overflow: hidden;
    cursor: grab;
    touch-action: none;
    background: #000;
  }

  .stage.dragging { cursor: grabbing; }

  .stage canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  .loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #8c8c96;
    font-size: 13px;
    pointer-events: none;
  }

  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 14px;
    background: #131318;
  }

  .controls button {
    appearance: none;
    border: 1px solid #2c2c34;
    background: #1f1f27;
    color: #f2f2f2;
    width: 40px;
    height: 40px;
    border-radius: 10px;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  .controls button:hover { background: #2a2a34; }
  .controls button:active { transform: scale(0.94); }

  .controls .reset {
    width: auto;
    padding: 0 16px;
    font-size: 13px;
    font-weight: 500;
  }

  .hint {
    text-align: center;
    font-size: 12px;
    color: #6f6f7a;
    padding: 10px 14px 16px;
    background: #131318;
  }

  /* Always-on circular pin marking a building on the sphere. Idle pins stay
     quiet (small glass bead); the focused one lights up with a red glow,
     a sonar-style pulse, and a slowly-rotating radar ring. */
  .pin-marker {
    position: absolute;
    top: 0;
    left: 0;
    width: 16px;
    height: 16px;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 5;
  }

  .pin-marker-core {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, #ffffff, #ced1d9 72%);
    box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.35), 0 1px 3px rgba(0, 0, 0, 0.4);
    transition: background 0.25s ease, box-shadow 0.25s ease;
  }

  .pin-marker.active .pin-marker-core {
    background: radial-gradient(circle at 32% 28%, #ff5f72, #c8102e 75%);
    box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.35), 0 0 14px 2px rgba(224, 18, 43, 0.75);
  }

  .pin-marker-pulse {
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    border: 2px solid rgba(224, 18, 43, 0.7);
    opacity: 0;
  }

  .pin-marker.active .pin-marker-pulse {
    animation: pin-pulse 1.8s ease-out infinite;
  }

  @keyframes pin-pulse {
    0%   { transform: scale(0.6); opacity: 0.9; }
    100% { transform: scale(2.1); opacity: 0; }
  }

  /* Slowly-rotating dashed reticle — only lit up on the currently focused pin */
  .pin-marker-ring {
    position: absolute;
    inset: -13px;
    border-radius: 50%;
    border: 1.5px dashed rgba(224, 18, 43, 0);
    opacity: 0;
    transition: opacity 0.3s ease, border-color 0.3s ease;
    animation: pin-ring-spin 7s linear infinite;
  }

  .pin-marker.active .pin-marker-ring {
    opacity: 1;
    border-color: rgba(224, 18, 43, 0.55);
  }

  @keyframes pin-ring-spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  /* SVG leader line + arrowhead connecting the focused pin to its callout */
  .leader-lines {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
    pointer-events: none;
    z-index: 4;
  }

  /* The line "draws" from the callout card down to the pin as it appears, and
     retracts back into the card the same way when it's no longer the focus. */
  .leader-line {
    stroke: #ff3b52;
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    filter: drop-shadow(0 0 4px rgba(224, 18, 43, 0.7));
    transition: stroke-dashoffset 0.34s ease-in 0.04s;
  }

  .leader-line.visible {
    transition: stroke-dashoffset 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0s;
  }

  .leader-arrowhead {
    fill: #ff3b52;
    opacity: 0;
    filter: drop-shadow(0 0 4px rgba(224, 18, 43, 0.7));
    transition: opacity 0.14s ease 0s;
  }

  .leader-arrowhead.visible {
    opacity: 1;
    transition: opacity 0.16s ease 0.4s; /* lands just as the line reaches the pin */
  }

  /* Glass callout card that appears beside whichever pin(s) are in focus.
     --focus-scale / --glow are set per-frame in JS from how centered the
     pin is, so the most-centered building's card sits subtly larger and
     brighter than the others — a soft depth-of-field cue. */
  .pin-callout {
    position: absolute;
    top: 0;
    left: 0;
    transform: translate(-50%, -100%) translateY(10px) scale(0.8);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.16s ease 0s, transform 0.16s ease 0s;
    z-index: 6;
  }

  .pin-callout.visible {
    opacity: 1;
    transform: translate(-50%, -100%) translateY(0) scale(var(--focus-scale, 1));
    transition: opacity 0.32s ease 0.16s, transform 0.46s cubic-bezier(0.34, 1.56, 0.64, 1) 0.16s;
  }

  .pin-callout-box {
    position: relative;
    display: inline-block;
    background: linear-gradient(160deg, rgba(216, 34, 58, 0.62), rgba(110, 8, 24, 0.62));
    backdrop-filter: blur(14px) saturate(180%);
    -webkit-backdrop-filter: blur(14px) saturate(180%);
    color: #fff;
    padding: 9px 18px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 700;
    white-space: nowrap;
    letter-spacing: 0.2px;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.3);
    box-shadow:
      0 12px 32px rgba(0, 0, 0, 0.45),
      inset 0 1px 0 rgba(255, 255, 255, 0.2),
      0 0 26px rgb(224 18 43 / var(--glow, 0.35));
    animation: card-float 4.5s ease-in-out infinite;
  }

  @keyframes card-float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-3px); }
  }

  /* Glass sheen across the top of the card */
  .pin-callout-box::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 12px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.35), rgba(255, 255, 255, 0) 55%);
    mix-blend-mode: overlay;
    pointer-events: none;
  }

  .pin-callout-box::after {
    content: '';
    position: absolute;
    left: 50%;
    bottom: -5px;
    width: 12px;
    height: 12px;
    background: rgba(130, 10, 26, 0.75);
    border-right: 1px solid rgba(255, 255, 255, 0.3);
    border-bottom: 1px solid rgba(255, 255, 255, 0.3);
    backdrop-filter: blur(14px) saturate(180%);
    -webkit-backdrop-filter: blur(14px) saturate(180%);
    transform: translateX(-50%) rotate(45deg);
    border-radius: 2px;
    z-index: -1;
  }

  .coord-tooltip {
    position: absolute;
    top: 0;
    left: 0;
    display: none;
    transform: translate(-50%, -130%);
    background: rgba(75, 107, 251, 0.95);
    color: #fff;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 12.5px;
    font-weight: 600;
    text-align: center;
    white-space: nowrap;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45);
    pointer-events: none;
    z-index: 10;
  }

  .coord-tooltip span {
    display: block;
    font-size: 10.5px;
    font-weight: 500;
    opacity: 0.85;
    margin-top: 2px;
  }
</style>
</head>

<script>
  // ---- Shared texture cache (same image reused across tabs) ----
  const textureLoader = new THREE.TextureLoader();
  textureLoader.crossOrigin = undefined; // avoid CORS-mode fetch, which file:// pages fail
  const textureCache = {};
  function loadTexture(url) {
    if (!textureCache[url]) {
      textureCache[url] = textureLoader.loadAsync
        ? textureLoader.loadAsync(url)
        : new Promise((resolve, reject) => textureLoader.load(url, resolve, undefined, reject));
    }
    return textureCache[url];
  }

  // ---- Panorama viewer factory (Street View style: look around inside a sphere) ----
  const DEFAULT_FOV = 75;
  const MIN_FOV = 20;
  const MAX_FOV = 100;
  const LOOK_SENSITIVITY = 0.12;

  // Dummy professional labels for nearby buildings, positioned by (lon, lat)
  // on the sphere. lon/lat were mapped from each building's pixel location
  // in the source equirectangular image (lon = 360 * x/width, lat = 90 - 180 * y/height).
  const BUILDING_LABELS = [
    { lon: 33,  lat: 13, name: 'Skyline Grand Hotel' },
    { lon: 125, lat: 7,  name: 'Horizon Business Park' },
    { lon: 185, lat: 4,  name: 'Crescent Residency Towers' },
    { lon: 232, lat: 4,  name: 'Meridian Corporate Plaza' },
    { lon: 342, lat: 5,  name: 'Palm Court Residences' },
    { lon: 268.9, lat: -14.7, name: 'petrol pump' },
  ];
  const LABEL_RADIUS = 480; // just inside the 500-radius sphere
  const raycaster = new THREE.Raycaster();
  const CLICK_MOVE_THRESHOLD = 6; // px — below this, a mouseup/touchend counts as a click, not a drag

  function sphToVec3(lon, lat, radius) {
    const phi = THREE.MathUtils.degToRad(90 - lat);
    const theta = THREE.MathUtils.degToRad(lon);
    return new THREE.Vector3(
      radius * Math.sin(phi) * Math.cos(theta),
      radius * Math.cos(phi),
      radius * Math.sin(phi) * Math.sin(theta)
    );
  }

  // Map-image overlays: pastes a flat image (e.g. a site map) onto the
  // sphere across 4 corner points, keyed by tab id. Corners go clockwise:
  // A = top-left of the image, B = top-right, C = bottom-right, D = bottom-left.
  // Get each corner's lon/lat by clicking that exact spot on the panorama
  // (the coordinate finder copies a ready-to-paste snippet).
  // Example — fill in real values and uncomment to activate on a tab:
  // const MAP_OVERLAYS = {
  //   yogesh4: {
  //     image: 'ashok2.png',
  //     corners: {
  //       A: { lon: 40,  lat: 10 },
  //       B: { lon: 80,  lat: 10 },
  //       C: { lon: 80,  lat: -20 },
  //       D: { lon: 40,  lat: -20 },
  //     },
  //   },
  // };
  const MAP_OVERLAYS = {
    yogesh: {
      image: 'ashok2.png',
      corners: {
        A: { lon: 101,   lat: -33.3 },
        B: { lon: 145.2, lat: -20.7 },
        C: { lon: 178.4, lat: -25.4 },
        D: { lon: 158.3, lat: -79.5 },
      },
    },
    yogesh2: {
      image: 'ashok2.png',
      corners: {
      //  { lon: 160.2, lat: -48, name: 'Building Name' },
      //  { lon: 248.7, lat: -49.3, name: 'Building Name' },
      //  { lon: 323, lat: -59.9, name: 'Building Name' },
      //  { lon: 93.5, lat: -60.2, name: 'Building Name' },
        A: { lon: 160.2, lat: -48 },
        B: { lon: 248.7, lat: -49.3 },
        C: { lon: 323, lat: -59.9 },
        D: { lon: 93.5, lat: -60.2 },
      },
    },
  };
  const MAP_OVERLAY_RADIUS = 495; // just inside the panorama sphere, in front of it
  const MAP_OVERLAY_SEGMENTS = 24; // grid density — higher = follows sphere curvature more smoothly

  function createPanoramaViewer(viewerEl) {
    const stage = viewerEl.querySelector('[data-stage]');
    const loadingEl = viewerEl.querySelector('[data-loading]');
    const zoomInBtn = viewerEl.querySelector('[data-zoom-in]');
    const zoomOutBtn = viewerEl.querySelector('[data-zoom-out]');
    const resetBtn = viewerEl.querySelector('[data-reset]');
    const imageUrl = viewerEl.dataset.image;
    const tabId = viewerEl.closest('.tab-content').id;

    let renderer, camera, scene, mesh;
    let lon = 0, lat = 0, fov = DEFAULT_FOV;
    let isDragging = false;
    let startX = 0, startY = 0, startLon = 0, startLat = 0;
    let started = false;
    let animId = null;
    let ready = false;
    let labels = []; // { markerEl, calloutEl, lineEl, tickEl, position: THREE.Vector3, active }
    let leaderSvg = null;

    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(fov, 16 / 9, 0.1, 1000);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      stage.appendChild(renderer.domElement);

      const geometry = new THREE.SphereGeometry(500, 60, 40);
      geometry.scale(-1, 1, 1); // flip so texture renders on the inside

      loadTexture(imageUrl).then(texture => {
        texture.generateMipmaps = false;
        texture.minFilter = THREE.LinearFilter;
        texture.magFilter = THREE.LinearFilter;
        const material = new THREE.MeshBasicMaterial({ map: texture });
        mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);
        createLabels();
        createMapOverlay();
        ready = true;
        if (loadingEl) loadingEl.style.display = 'none';
        resize();
        render();
      }).catch(err => {
        if (loadingEl) loadingEl.textContent = 'Failed to load image';
        console.error('Panorama load error:', err);
      });

      // Drag to look around
      stage.addEventListener('mousedown', e => {
        e.preventDefault();
        beginDrag(e.clientX, e.clientY);
      });
      window.addEventListener('mousemove', e => moveDrag(e.clientX, e.clientY));
      window.addEventListener('mouseup', e => endDrag(e.clientX, e.clientY));

      stage.addEventListener('touchstart', e => {
        const t = e.touches[0];
        beginDrag(t.clientX, t.clientY);
      }, { passive: true });
      stage.addEventListener('touchmove', e => {
        const t = e.touches[0];
        moveDrag(t.clientX, t.clientY);
      }, { passive: true });
      stage.addEventListener('touchend', e => {
        const t = e.changedTouches[0];
        endDrag(t.clientX, t.clientY);
      });

      // Zoom via scroll (changes field of view, like real street view)
      stage.addEventListener('wheel', e => {
        e.preventDefault();
        setFov(fov + (e.deltaY > 0 ? 4 : -4));
      }, { passive: false });

      zoomInBtn.addEventListener('click', () => setFov(fov - 8));
      zoomOutBtn.addEventListener('click', () => setFov(fov + 8));
      resetBtn.addEventListener('click', () => {
        lon = 0; lat = 0;
        setFov(DEFAULT_FOV);
        render();
      });

      window.addEventListener('resize', resize);
    }

    // ---- Building callouts: always-on pin dots + a red "krpano-style" leader
    // arrow + label that activates for whichever pin(s) are near screen-center.
    //
    // The activation cone scales with zoom (fov / DISTANCE_POPUP_DIVISOR), same idea
    // as krpano's own "distancepopup" callout setting, so zooming in narrows it.
    // A callout only drops once a pin drifts well past that cone (EXIT_ANGLE_MULT)
    // and has been up for at least MIN_HOLD_MS — that hysteresis is what stops two
    // nearby buildings from rapidly swapping/flickering while dragging.
    const DISTANCE_POPUP_DIVISOR = 5;
    const EXIT_ANGLE_MULT = 1.6;
    const MIN_HOLD_MS = 400;
    const MAX_ACTIVE_CALLOUTS = 4;
    const CALLOUT_OFFSET_X = 74;
    const CALLOUT_OFFSET_Y = 84;
    const CALLOUT_GAP = 10;       // enforced clear space between neighboring callout boxes
    const SIDE_FLIP_MARGIN = 50;  // px past screen-center before a box flips side (stops jitter)
    const ARROW_SETBACK = 13;     // px the line stops short of the pin, where the arrowhead fills in
    const ARROW_LEN = 12;
    const ARROW_HALF_W = 5;

    function createLabels() {
      const svgNs = 'http://www.w3.org/2000/svg';
      leaderSvg = document.createElementNS(svgNs, 'svg');
      leaderSvg.setAttribute('class', 'leader-lines');
      stage.appendChild(leaderSvg);

      labels = BUILDING_LABELS.map((def, index) => {
        const phi = THREE.MathUtils.degToRad(90 - def.lat);
        const theta = THREE.MathUtils.degToRad(def.lon);
        const position = new THREE.Vector3(
          LABEL_RADIUS * Math.sin(phi) * Math.cos(theta),
          LABEL_RADIUS * Math.cos(phi),
          LABEL_RADIUS * Math.sin(phi) * Math.sin(theta)
        );

        const markerEl = document.createElement('div');
        markerEl.className = 'pin-marker';
        markerEl.innerHTML = '<span class="pin-marker-ring"></span><span class="pin-marker-pulse"></span><span class="pin-marker-core"></span>';
        stage.appendChild(markerEl);

        const calloutEl = document.createElement('div');
        calloutEl.className = 'pin-callout';
        calloutEl.innerHTML = '<span class="pin-callout-box">' + def.name + '</span>';
        stage.appendChild(calloutEl);

        const lineEl = document.createElementNS(svgNs, 'line');
        lineEl.setAttribute('class', 'leader-line');
        const arrowEl = document.createElementNS(svgNs, 'polygon');
        arrowEl.setAttribute('class', 'leader-arrowhead');
        leaderSvg.appendChild(lineEl);
        leaderSvg.appendChild(arrowEl);

        return {
          index, markerEl, calloutEl, lineEl, arrowEl, position,
          active: false, activatedAt: 0, calloutSide: null, lineLength: 0,
          screenX: 0, screenY: 0, angleDeg: 999,
        };
      });
    }

    // Positions every pin each frame, decides which pins currently "own" a callout
    // (with hysteresis so the choice is stable while dragging), then lays those
    // callouts out so their boxes never overlap.
    function updateLabels() {
      if (!labels.length) return;
      const camDir = new THREE.Vector3();
      camera.getWorldDirection(camDir);
      const w = stage.clientWidth || 1;
      const h = stage.clientHeight || 1;
      const now = performance.now();

      const visible = [];
      labels.forEach(label => {
        const pointDir = label.position.clone().normalize();
        const facing = pointDir.dot(camDir);

        if (facing < 0.2) {
          label.markerEl.style.display = 'none';
          if (label.active) deactivateCallout(label);
          return;
        }

        const ndc = label.position.clone().project(camera);
        label.screenX = (ndc.x * 0.5 + 0.5) * w;
        label.screenY = (-ndc.y * 0.5 + 0.5) * h;
        label.angleDeg = THREE.MathUtils.radToDeg(Math.acos(THREE.MathUtils.clamp(facing, -1, 1)));

        label.markerEl.style.display = 'flex';
        label.markerEl.style.left = label.screenX + 'px';
        label.markerEl.style.top = label.screenY + 'px';
        visible.push(label);
      });

      const enterAngle = fov / DISTANCE_POPUP_DIVISOR;
      const exitAngle = enterAngle * EXIT_ANGLE_MULT;

      labels.forEach(label => {
        if (!label.active) return;
        const stillVisible = visible.indexOf(label) !== -1;
        const tooFar = !stillVisible || label.angleDeg > exitAngle;
        if (tooFar && now - label.activatedAt > MIN_HOLD_MS) deactivateCallout(label);
      });

      let activeCount = labels.reduce((n, l) => n + (l.active ? 1 : 0), 0);
      if (activeCount < MAX_ACTIVE_CALLOUTS) {
        const candidates = visible
          .filter(label => !label.active && label.angleDeg < enterAngle)
          .sort((a, b) => a.angleDeg - b.angleDeg);
        for (const label of candidates) {
          if (activeCount >= MAX_ACTIVE_CALLOUTS) break;
          activateCallout(label, now);
          activeCount++;
        }
      }

      layoutCallouts(labels.filter(label => label.active), w, enterAngle);
    }

    function activateCallout(label, now) {
      label.active = true;
      label.activatedAt = now;
      label.markerEl.classList.add('active');
    }

    function deactivateCallout(label) {
      label.active = false;
      label.markerEl.classList.remove('active');
      label.calloutEl.classList.remove('visible');
      label.lineEl.classList.remove('visible');
      label.arrowEl.classList.remove('visible');
      if (label.lineLength) label.lineEl.style.strokeDashoffset = label.lineLength + 'px';
    }

    // Places every active callout box beside its pin, nudging any box that would
    // overlap an already-placed one further up its own sightline until it's clear.
    // A fixed sort order (definition order, not live screen position) keeps that
    // nudging stable frame to frame instead of jittering when two pins are close.
    function layoutCallouts(activeLabels, viewportW, enterAngle) {
      const placedRects = [];
      const ordered = activeLabels.slice().sort((a, b) => a.index - b.index);

      ordered.forEach(label => {
        if (label.calloutSide === null) {
          label.calloutSide = label.screenX > viewportW / 2 ? -1 : 1;
        } else if (label.calloutSide === 1 && label.screenX > viewportW / 2 + SIDE_FLIP_MARGIN) {
          label.calloutSide = -1;
        } else if (label.calloutSide === -1 && label.screenX < viewportW / 2 - SIDE_FLIP_MARGIN) {
          label.calloutSide = 1;
        }

        const boxW = label.calloutEl.offsetWidth || 130;
        const boxH = label.calloutEl.offsetHeight || 32;
        const anchorX = label.screenX + label.calloutSide * CALLOUT_OFFSET_X;
        let anchorY = label.screenY - CALLOUT_OFFSET_Y;

        let rect = { left: anchorX - boxW / 2, right: anchorX + boxW / 2, top: anchorY - boxH, bottom: anchorY };
        let guard = 0;
        while (guard++ < 30 && placedRects.some(r => rectsOverlap(rect, r, CALLOUT_GAP))) {
          anchorY -= boxH * 0.6 + CALLOUT_GAP;
          rect = { left: anchorX - boxW / 2, right: anchorX + boxW / 2, top: anchorY - boxH, bottom: anchorY };
        }

        placedRects.push(rect);
        positionCallout(label, anchorX, anchorY, enterAngle);
      });
    }

    function rectsOverlap(a, b, gap) {
      return !(a.right + gap < b.left || a.left - gap > b.right || a.bottom + gap < b.top || a.top - gap > b.bottom);
    }

    function positionCallout(label, calloutX, calloutY, enterAngle) {
      // How dead-center this pin is (1 = perfectly centered, 0 = at the edge of the
      // activation cone) drives a soft depth-of-field cue: the focused building's
      // card sits a touch larger and glows brighter than the others in view.
      const focus = THREE.MathUtils.clamp(1 - label.angleDeg / enterAngle, 0, 1);
      label.calloutEl.style.setProperty('--focus-scale', (1 + focus * 0.1).toFixed(3));
      label.calloutEl.style.setProperty('--glow', (0.25 + focus * 0.4).toFixed(2));

      label.calloutEl.style.left = calloutX + 'px';
      label.calloutEl.style.top = calloutY + 'px';
      label.calloutEl.classList.add('visible');

      const dx = label.screenX - calloutX;
      const dy = label.screenY - calloutY;
      const len = Math.hypot(dx, dy) || 1;
      const ux = dx / len, uy = dy / len;
      const px = -uy, py = ux;

      const baseX = label.screenX - ux * ARROW_SETBACK;
      const baseY = label.screenY - uy * ARROW_SETBACK;

      label.lineEl.setAttribute('x1', calloutX);
      label.lineEl.setAttribute('y1', calloutY);
      label.lineEl.setAttribute('x2', baseX);
      label.lineEl.setAttribute('y2', baseY);

      const backX = label.screenX - ux * ARROW_LEN;
      const backY = label.screenY - uy * ARROW_LEN;
      label.arrowEl.setAttribute('points',
        label.screenX + ',' + label.screenY + ' ' +
        (backX + px * ARROW_HALF_W) + ',' + (backY + py * ARROW_HALF_W) + ' ' +
        (backX - px * ARROW_HALF_W) + ',' + (backY - py * ARROW_HALF_W)
      );
      label.arrowEl.classList.add('visible');

      const wasVisible = label.lineEl.classList.contains('visible');
      const lineLen = Math.hypot(baseX - calloutX, baseY - calloutY) || 1;
      label.lineLength = lineLen;
      label.lineEl.style.strokeDasharray = lineLen + 'px';
      label.lineEl.classList.add('visible');
      if (!wasVisible) {
        // start fully retracted, then let the .visible transition draw it out
        label.lineEl.style.strokeDashoffset = lineLen + 'px';
        requestAnimationFrame(() => { label.lineEl.style.strokeDashoffset = '0px'; });
      } else {
        label.lineEl.style.strokeDashoffset = '0px';
      }
    }

    function createMapOverlay() {
      const def = MAP_OVERLAYS[tabId];
      if (!def) return;

      loadTexture(def.image).then(texture => {
        texture.generateMipmaps = false;
        texture.minFilter = THREE.LinearFilter;
        texture.magFilter = THREE.LinearFilter;

        const { A, B, C, D } = def.corners;
        const posA = sphToVec3(A.lon, A.lat, MAP_OVERLAY_RADIUS);
        const posB = sphToVec3(B.lon, B.lat, MAP_OVERLAY_RADIUS);
        const posC = sphToVec3(C.lon, C.lat, MAP_OVERLAY_RADIUS);
        const posD = sphToVec3(D.lon, D.lat, MAP_OVERLAY_RADIUS);

        const seg = MAP_OVERLAY_SEGMENTS;
        const positions = [];
        const uvs = [];
        const indices = [];

        for (let j = 0; j <= seg; j++) {
          const v = j / seg;
          for (let i = 0; i <= seg; i++) {
            const u = i / seg;
            const top = posA.clone().lerp(posB, u);
            const bottom = posD.clone().lerp(posC, u);
            const p = top.lerp(bottom, v);
            p.normalize().multiplyScalar(MAP_OVERLAY_RADIUS); // hug the sphere's curvature
            positions.push(p.x, p.y, p.z);
            uvs.push(u, 1 - v);
          }
        }
        for (let j = 0; j < seg; j++) {
          for (let i = 0; i < seg; i++) {
            const a = j * (seg + 1) + i;
            const b = a + 1;
            const c = a + (seg + 1);
            const d = c + 1;
            indices.push(a, c, b, b, c, d);
          }
        }

        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
        geometry.setIndex(indices);
        geometry.computeVertexNormals();

        const material = new THREE.MeshBasicMaterial({
          map: texture,
          side: THREE.DoubleSide,
          transparent: true,
        });
        const overlayMesh = new THREE.Mesh(geometry, material);
        scene.add(overlayMesh);
      }).catch(err => {
        console.error('Map overlay failed to load:', def.image, err);
      });
    }

    function beginDrag(x, y) {
      isDragging = true;
      startX = x; startY = y;
      startLon = lon; startLat = lat;
      stage.classList.add('dragging');
    }

    function moveDrag(x, y) {
      if (!isDragging) return;
      lon = startLon - (x - startX) * LOOK_SENSITIVITY;
      lat = startLat + (y - startY) * LOOK_SENSITIVITY;
      lat = Math.max(-85, Math.min(85, lat));
      render();
    }

    function endDrag(x, y) {
      const moved = Math.hypot(x - startX, y - startY);
      isDragging = false;
      stage.classList.remove('dragging');
      if (moved < CLICK_MOVE_THRESHOLD) {
        inspectPoint(x, y);
      }
    }

    // ---- Coordinate finder: click a spot to get its lon/lat for BUILDING_LABELS ----
    function inspectPoint(clientX, clientY) {
      if (!ready || !mesh) return;
      const rect = stage.getBoundingClientRect();
      const ndc = new THREE.Vector2(
        ((clientX - rect.left) / rect.width) * 2 - 1,
        -((clientY - rect.top) / rect.height) * 2 + 1
      );
      raycaster.setFromCamera(ndc, camera);
      const hits = raycaster.intersectObject(mesh);
      if (!hits.length) return;

      const p = hits[0].point;
      const radius = p.length();
      let hitLat = 90 - THREE.MathUtils.radToDeg(Math.acos(p.y / radius));
      let hitLon = THREE.MathUtils.radToDeg(Math.atan2(p.z, p.x));
      if (hitLon < 0) hitLon += 360;
      hitLat = Math.round(hitLat * 10) / 10;
      hitLon = Math.round(hitLon * 10) / 10;

      const snippet = `{ lon: ${hitLon}, lat: ${hitLat}, name: 'Building Name' },`;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(snippet).catch(() => {});
      }
      console.log('Panorama coordinates:', snippet);
      showCoordTooltip(clientX - rect.left, clientY - rect.top, hitLon, hitLat);
    }

    let coordTooltipEl = null;
    let coordTooltipTimer = null;
    function showCoordTooltip(x, y, hitLon, hitLat) {
      if (!coordTooltipEl) {
        coordTooltipEl = document.createElement('div');
        coordTooltipEl.className = 'coord-tooltip';
        stage.appendChild(coordTooltipEl);
      }
      coordTooltipEl.style.left = x + 'px';
      coordTooltipEl.style.top = y + 'px';
      coordTooltipEl.innerHTML =
        `lon: ${hitLon}&deg; &middot; lat: ${hitLat}&deg;<br><span>copied &mdash; paste into BUILDING_LABELS</span>`;
      coordTooltipEl.style.display = 'block';

      clearTimeout(coordTooltipTimer);
      coordTooltipTimer = setTimeout(() => {
        if (coordTooltipEl) coordTooltipEl.style.display = 'none';
      }, 4000);
    }

    function setFov(v) {
      fov = Math.max(MIN_FOV, Math.min(MAX_FOV, v));
      if (camera) {
        camera.fov = fov;
        camera.updateProjectionMatrix();
      }
      render();
    }

    function resize() {
      if (!renderer || !camera) return;
      const w = stage.clientWidth || 1;
      const h = stage.clientHeight || 1;
      renderer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      render();
    }

    function render() {
      if (!ready) return;
      const phi = THREE.MathUtils.degToRad(90 - lat);
      const theta = THREE.MathUtils.degToRad(lon);
      const target = new THREE.Vector3(
        500 * Math.sin(phi) * Math.cos(theta),
        500 * Math.cos(phi),
        500 * Math.sin(phi) * Math.sin(theta)
      );
      camera.lookAt(target);
      renderer.render(scene, camera);
      updateLabels();
    }

    return {
      activate() {
        if (!started) {
          started = true;
          init();
        } else {
          resize();
          render();
        }
      },
    };
  }

  // ---- Init first tab immediately, others lazily on first view ----
  const viewers = {};
  document.querySelectorAll('[data-viewer]').forEach(el => {
    const tabId = el.closest('.tab-content').id;
    viewers[tabId] = createPanoramaViewer(el);
  });
  viewers['yogesh'].activate();

  // ---- Tab switching ----
  const tabBtns = document.querySelectorAll('.tab-btn');
  const tabContents = document.querySelectorAll('.tab-content');

  tabBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      tabBtns.forEach(b => b.classList.remove('active'));
      tabContents.forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      const target = btn.dataset.target;
      document.getElementById(target).classList.add('active');
      viewers[target].activate();
    });
  });
</script>

</body>
</html>
